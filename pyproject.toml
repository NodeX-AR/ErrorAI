[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ErrorAI"
version = "2.0.0"
description = "Python-only autonomous runtime that watches/analyzes errors with safe local auto-fix fallbacks."
readme = "README.md"
authors = [
    { name = "Aswanth R" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = ["platformdirs>=3.0"]

[project.optional-dependencies]
local-model = ["llama-cpp-python>=0.2.90"]
watch = ["watchdog>=4.0.0"]

[project.scripts]
errorai = "errorai.cli:main"

[project.urls]
Homepage = "https://github.com/NodeX-AR/ErrorAI"
