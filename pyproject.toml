[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ErrorAI"
version = "1.11.0"
description = "Python-only autonomous runtime that watches/analyzes errors with safe local auto-fix fallbacks."
readme = "README.md"
authors = [
    { name = "Aswanth R" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "platformdirs>=3.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Default install uses the hosted http_api provider (no local model, no
# heavy ML deps). Install this extra for a fully local/offline model.
pro = [
    "onnxruntime>=1.18.0",
    "optimum[onnxruntime]>=1.20.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.23.0",
]
watch = ["watchdog>=4.0.0"]

[project.scripts]
errorai = "errorai.cli:main"

[project.urls]
Homepage = "https://github.com/NodeX-AR/ErrorAI"
